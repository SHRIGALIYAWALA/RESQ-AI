services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resq_ai}
      POSTGRES_USER: ${POSTGRES_USER:-resq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      REQUIRE_AUTH: "true"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resq_ai}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to the public HTTPS URL}
      NOTIFICATION_WEBHOOK_URL: http://ntfy:80/resq-alerts
      LOCAL_ONLY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      ntfy:
        condition: service_started

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      - app

  ntfy:
    image: binwiederhier/ntfy:v2.11
    restart: unless-stopped
    command: serve
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_config:/etc/ntfy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - frontend

volumes:
  postgres_data:
  ntfy_cache:
  ntfy_config:
